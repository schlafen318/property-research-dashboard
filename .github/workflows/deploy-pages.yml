name: Deploy static dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build dashboard
        env:
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
        run: python3 src/build_unified_app.py

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-google:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Google API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "google-api-python-client>=2,<3" "google-auth>=2,<3" "google-auth-httplib2>=0.2,<1"

      - name: Submit sitemap to Google Search Console
        env:
          GOOGLE_SEARCH_CONSOLE_TOKEN_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_TOKEN_JSON }}
        run: python3 scripts/google_sitemap_submit.py

      - name: Upload sitemap submission receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: google-sitemap-submission
          path: output/seo/google-sitemap-submission.json
          if-no-files-found: warn
