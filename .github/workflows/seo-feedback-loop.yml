name: SEO feedback loop

on:
  schedule:
    - cron: "17 1 * * *" # 09:17 HKT primary, avoids top-of-hour schedule contention
    - cron: "47 2 * * *" # 10:47 HKT backup if the primary scheduled event is delayed or dropped
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: seo-feedback-loop
  cancel-in-progress: false

jobs:
  feedback-loop:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_SEARCH_CONSOLE_TOKEN_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_TOKEN_JSON }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "google-api-python-client>=2,<3" "google-auth>=2,<3" "google-auth-httplib2>=0.2,<1" "openai>=2,<3"

      - name: Validate required secrets
        run: |
          if [ -z "$GOOGLE_SEARCH_CONSOLE_TOKEN_JSON" ]; then
            echo "GOOGLE_SEARCH_CONSOLE_TOKEN_JSON is required for the SEO feedback loop." >&2
            exit 1
          fi

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate SEO monitor report
        run: python3 scripts/seo_monitor.py --write --submit-sitemap --json-output output/seo/latest.json

      - name: Submit URLs to IndexNow
        run: python3 scripts/indexnow_submit.py --write --output output/seo/indexnow-latest.json --allow-failure

      - name: Verify tracking coverage
        run: python3 codex-skills/global-home-atlas-analytics/scripts/verify_tracking.py

      - name: Run feedback loop
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEO_CONTENT_MODEL: ${{ vars.SEO_CONTENT_MODEL || 'gpt-5.6' }}
        run: python3 scripts/seo_feedback_loop.py --apply --notify-user schlafen318 --summary-output output/seo/feedback-loop-summary.json

      - name: Generate SEO status dashboard
        if: always()
        run: python3 scripts/seo_status_dashboard.py --report output/seo/latest.json --indexnow-report output/seo/indexnow-latest.json --output artifacts/seo-status/index.html

      - name: Send SEO notifications
        if: always()
        env:
          SEO_NOTIFY_SMTP_HOST: ${{ secrets.SEO_NOTIFY_SMTP_HOST }}
          SEO_NOTIFY_SMTP_PORT: ${{ secrets.SEO_NOTIFY_SMTP_PORT }}
          SEO_NOTIFY_SMTP_USERNAME: ${{ secrets.SEO_NOTIFY_SMTP_USERNAME }}
          SEO_NOTIFY_SMTP_PASSWORD: ${{ secrets.SEO_NOTIFY_SMTP_PASSWORD }}
          SEO_NOTIFY_SMTP_TLS: ${{ secrets.SEO_NOTIFY_SMTP_TLS }}
          SEO_NOTIFY_EMAIL_FROM: ${{ secrets.SEO_NOTIFY_EMAIL_FROM }}
          SEO_NOTIFY_EMAIL_TO: ${{ secrets.SEO_NOTIFY_EMAIL_TO }}
          SEO_NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.SEO_NOTIFY_TELEGRAM_BOT_TOKEN }}
          SEO_NOTIFY_TELEGRAM_CHAT_ID: ${{ secrets.SEO_NOTIFY_TELEGRAM_CHAT_ID }}
        run: python3 scripts/seo_email_notification.py --feedback-summary output/seo/feedback-loop-summary.json

      - name: Commit SEO status dashboard
        if: always()
        run: |
          git add artifacts/seo-status/index.html
          if git diff --cached --quiet; then
            echo "SEO status dashboard unchanged."
          else
            git commit -m "Update SEO status dashboard"
            git push
            gh workflow run "Deploy static dashboard" --ref main
          fi

      - name: Upload SEO reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-monitor-report
          path: |
            output/seo/*.md
            output/seo/*.json
          if-no-files-found: warn
